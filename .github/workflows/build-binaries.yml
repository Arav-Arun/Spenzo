name: Build & Release Binaries

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: spenzo-mac
          - os: windows-latest
            name: spenzo-win.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          python -c "import tomllib, pathlib; p = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print('\n'.join(p['project']['dependencies']))" > _deps.txt
          pip install -r _deps.txt
        shell: bash

      - name: Build binary
        run: pyinstaller --onefile --name ${{ matrix.name }} server/main.py
        shell: bash

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.name }}
