[project]
name = "spenzo"
version = "0.3.0"
description = "Spenzo, your personal finance buddy on WhatsApp and Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.1",
    "fastmcp>=3.1.1",
    "httpx>=0.28.1",
    "openai>=2.29.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:websockets.*", "ignore::DeprecationWarning:uvicorn.*"]
